name: Build Windows plugin

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build obs-dv-capture
        run: cmake --build build --config Release --target obs-dv-capture

      - name: Assemble portable package
        shell: bash
        run: |
          set -e
          PKG="obs-dv-capture-${GITHUB_REF_NAME:-dev}-windows-x64"
          mkdir -p "$PKG/obs-plugins/64bit"
          mkdir -p "$PKG/data/obs-plugins/obs-dv-capture/locale"
          cp build/Release/obs-dv-capture.dll "$PKG/obs-plugins/64bit/"
          cp resources/locale/en-US.ini "$PKG/data/obs-plugins/obs-dv-capture/locale/"
          cp README.md "$PKG/"
          cp INSTALL.txt "$PKG/" 2>/dev/null || true
          powershell -NoProfile -Command "Compress-Archive -Path '$PKG/*' -DestinationPath '$PKG.zip' -Force"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.PKG }}.zip
