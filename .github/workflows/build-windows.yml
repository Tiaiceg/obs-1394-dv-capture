name: Build Windows plugin

on:
  push:
    branches: [main, master]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin
        shell: pwsh
        run: .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package plugin
        shell: pwsh
        run: .github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-1394-dv-capture-${{ github.sha }}
          path: release/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: release/*.zip
